[build]
  publish = "."

[[redirects]]
  from = "/api/crm"
  to = "/.netlify/functions/crm"
  status = 200
  force = true

[[redirects]]
  from = "/crm"
  to = "/crm/"
  status = 301

[[redirects]]
  from = "/crm/*"
  to = "/crm/:splat"
  status = 200
  force = true
  conditions = { Role = ["admin"] }
