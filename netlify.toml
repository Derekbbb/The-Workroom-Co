[build]
  publish = "."

[[redirects]]
  from = "/api/crm"
  to = "/.netlify/functions/crm"
  status = 200
  force = true

[[redirects]]
  from = "/crm/"
  to = "/crm/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/crm/"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/crm/*"
  to = "/crm/:splat"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/crm/*"
  to = "/"
  status = 302
  force = true
